name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, runner: ubuntu-24.04, container: 'quay.io/pypa/manylinux_2_28_x86_64' }
          - { target: windows-x64, runner: windows-2022, container: '' }
          - { target: macos-x64, runner: macos-15-intel, container: '' }
          - { target: macos-arm64, runner: macos-14, container: '' }
    defaults:
      run:
        shell: bash
    steps:
      - name: Prepare manylinux container
        if: runner.os == 'Linux'
        run: |
          command -v git || dnf -y install git
          echo '/opt/python/cp311-cp311/bin' >> "$GITHUB_PATH"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: runner.os != 'Linux'
        with:
          python-version: '3.11'
      - name: Install pinned build requirements
        run: |
          python -m pip install -r requirements/build.txt
          if [[ "$RUNNER_OS" == Linux ]]; then python -m pip install auditwheel==6.4.2; fi
          if [[ "$RUNNER_OS" == macOS ]]; then python -m pip install delocate==0.12.0; fi
      - name: Build
        run: python -u build.py --work-dir "$RUNNER_TEMP/native-build" --output-dir dist
      - name: Audit stable ABI and finalize wheel tags
        run: python -u finalize.py dist
      - name: Smoke test next to the official cv2
        run: |
          python -m pip install -r requirements/test.txt
          python -m pip install --no-deps dist/*.whl opencv-python-headless==4.11.0.86
          cd "$RUNNER_TEMP"
          python -u "$GITHUB_WORKSPACE/smoke_test.py" > "$GITHUB_WORKSPACE/dist/smoke-test.txt"
          python -u "$GITHUB_WORKSPACE/smoke_test.py" --private-first >> "$GITHUB_WORKSPACE/dist/smoke-test.txt"
          cat "$GITHUB_WORKSPACE/dist/smoke-test.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.whl
            dist/build-provenance.json
            dist/abi3-audit.json
            dist/smoke-test.txt
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts
      - name: Collect release files
        run: |
          mkdir release
          for target in linux-x64 windows-x64 macos-x64 macos-arm64; do
            cp artifacts/$target/*.whl release/
            cp artifacts/$target/build-provenance.json release/$target.build-provenance.json
            cp artifacts/$target/smoke-test.txt release/$target.smoke-test.txt
          done
          cd release && sha256sum *.whl > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*.whl
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
            --notes "Built by ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. Each wheel has a signed build provenance attestation; see README for how to verify it."
